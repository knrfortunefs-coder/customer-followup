<html lang="en">
<head>

<title>KNR Fortune Financial Services - Customers Follow-up CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#16233a;
    --navy:#1c3557;
    --navy-deep:#0f2038;
    --teal:#0f7a6b;
    --teal-light:#e4f4f1;
    --clay:#c9622f;
    --clay-light:#fbeadf;
    --paper:#f6f4ef;
    --card:#ffffff;
    --line:#e3ddd0;
    --muted:#736b5c;
    --danger:#b3402f;
    --ok:#1f7a4d;
    --warn:#b8862d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:14px 20px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
    width:100%;
    box-sizing:border-box;
    position:relative;
  }
  .headerSpacer{min-width:0;}
  .headerLeft{display:flex;align-items:center;gap:14px;min-width:0;justify-self:center;grid-column:2;}
  .headerLeft img{
    height:64px;width:auto;max-width:220px;border-radius:8px;object-fit:contain;flex-shrink:0;
    background:#fff;padding:6px 10px;
  }
  .headerTitles{min-width:0;}
  header h1{margin:0;font-size:1.25rem;letter-spacing:.2px;line-height:1.25;white-space:nowrap;}
  header .sub{font-size:1rem;opacity:.9;margin-top:3px;white-space:nowrap;font-weight:500;}
  .headerRight{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-self:end;grid-column:3;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:8px;
    font-size:.88rem;padding:9px 14px;transition:filter .15s, transform .1s;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .btn-primary{background:var(--clay);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}
  .btn-secondary{background:var(--teal-light);color:var(--teal);}
  .btn-secondary:hover{filter:brightness(.97);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:var(--clay-light);color:var(--danger);}
  .btn-link{background:none;color:var(--teal);padding:4px 0;text-decoration:underline;font-size:.82rem;}
  main{max-width:1100px;margin:0 auto;padding:20px;}

  /* Tab bar */
  .tabs{display:flex;gap:6px;background:var(--navy-deep);padding:0 20px;overflow-x:auto;}
  .tabBtn{background:none;color:rgba(255,255,255,.65);border-radius:0;padding:12px 16px;font-weight:600;font-size:.88rem;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabBtn:hover{color:#fff;}
  .tabBtn.active{color:#fff;border-bottom-color:var(--clay);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:box-shadow .15s, border-color .15s;}
  .stat:hover{box-shadow:0 3px 10px rgba(28,53,87,.08);}
  .stat.active{box-shadow:0 0 0 2px var(--sc,var(--teal-light));}
  .stat .num{font-size:1.5rem;font-weight:700;color:var(--navy);}
  .stat .lbl{font-size:.74rem;color:var(--muted);margin-top:2px;}
  .stat .icon{font-size:1.1rem;margin-bottom:2px;display:block;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{

    font-size:.9rem;background:#fff;color:var(--ink);

  .toolbar input[type=text]{flex:1;min-width:180px;}
  .toolbar select{min-width:150px;}

  table{width:100%;border-collapse:collapse;font-size:.87rem;}

  tr:hover td{background:#faf8f2;}

  .b-postponed{background:#fbf0d9;color:var(--warn);}
  .b-metint{background:#e3f4e6;color:var(--ok);}
  .b-metno{background:#f2e6e2;color:#8a5a4a;}
  .b-missed{background:var(--clay-light);color:var(--danger);}
  .b-converted{background:#1f7a4d;color:#fff;}
  .b-rejected{background:#e9e5dd;color:#8a8378;}

  .fu-today{background:#fbf0d9;color:var(--warn);font-weight:600;}

  .rowActions{display:flex;gap:6px;flex-wrap:wrap;}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);}

  .modal .hint{font-size:.8rem;color:var(--muted);margin-bottom:16px;}

  .toast.show{opacity:1;}
  .loading{text-align:center;padding:40px;color:var(--muted);}

  /* Lock screen */

    position:fixed;inset:0;background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;

  .lockBox{background:#fff;border-radius:16px;padding:30px 28px;max-width:360px;width:100%;text-align:center;}
  .lockBox .icon{font-size:2.2rem;margin-bottom:6px;}
  .lockBox h2{margin:4px 0 4px;color:var(--navy);font-size:1.2rem;}
  .lockBox p{color:var(--muted);font-size:.85rem;margin:0 0 16px;}
  .pinDots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
  .pinDot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff;}
  .pinDot.filled{background:var(--navy);border-color:var(--navy);}
  .pinPad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
  .pinPad button{background:#f1efe8;color:var(--ink);font-size:1.1rem;padding:16px 0;border-radius:10px;font-weight:600;}

  .pinPad .pinClear{background:var(--clay-light);color:var(--danger);font-size:.8rem;}
  .pinPad .pinBack{background:var(--teal-light);color:var(--teal);font-size:.8rem;}

  .upcomingTitle{font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:10px;}
  .upcomingGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .upcomingCol{border-radius:var(--radius);padding:12px;border:1px solid var(--line);background:#fff;}
  .upcomingCol.today{border-color:#e8b3a4;background:linear-gradient(180deg,#fff,var(--clay-light) 400%);}
  .upcomingCol.tomorrow{border-color:#e9d3a0;background:linear-gradient(180deg,#fff,#fbf0d9 400%);}
  .upcomingCol.dayafter{border-color:#a9c7e0;background:linear-gradient(180deg,#fff,#e7f0f9 400%);}
  .upcomingColHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .upcomingColHead .dlabel{font-weight:700;font-size:.86rem;}
  .today .dlabel{color:var(--danger);}
  .tomorrow .dlabel{color:var(--warn);}
  .dayafter .dlabel{color:#2b5c8f;}
  .upcomingColHead .ddate{font-size:.72rem;color:var(--muted);}
  .upcomingCount{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,.06);}
  .upcomingItem{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer;}
  .upcomingItem:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .upcomingItem:last-child{margin-bottom:0;}
  .upcomingItem .uName{font-weight:600;color:var(--navy);font-size:.85rem;}
  .upcomingItem .uPhone{font-size:.75rem;color:var(--muted);}
  .upcomingItem .uService{font-size:.72rem;color:var(--teal);font-weight:600;margin-top:2px;}
  .phoneActions{display:inline-flex;gap:6px;margin-left:6px;vertical-align:middle;}
  .phoneBtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;text-decoration:none;font-size:.85rem;}
  .phoneCall{background:var(--teal-light);}
  .phoneWa{background:#dcf5e3;}
  .phone-cell{color:var(--muted);font-size:.83rem;display:flex;align-items:center;flex-wrap:wrap;gap:2px;}
  .historyEntry{border-left:3px solid var(--line);padding:6px 0 10px 12px;margin-bottom:4px;}
  .historyTime{font-size:.72rem;color:var(--muted);margin-bottom:4px;}
  .historyNotes{font-size:.85rem;color:var(--ink);margin-top:5px;}
  .upcomingTag{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:20px;margin-top:3px;}
  .tag-appt{background:var(--teal-light);color:var(--teal);}
  .tag-followup{background:#eee9dc;color:var(--muted);}
  .upcomingEmpty{font-size:.78rem;color:var(--muted);padding:6px 2px;}

  @media(max-width:640px){
    header{padding:12px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;}
    .headerSpacer{display:none;}
    .headerLeft{justify-self:auto;grid-column:auto;}
    .headerLeft img{height:38px;max-width:120px;padding:3px 6px;}
    header h1{font-size:1rem;max-width:58vw;overflow:hidden;text-overflow:ellipsis;}
    header .sub{font-size:.85rem;max-width:58vw;overflow:hidden;text-overflow:ellipsis;opacity:.9;}
    .headerRight{justify-self:auto;grid-column:auto;}
    .headerRight button{padding:7px 10px;font-size:.8rem;}
    table:not(.matrixTable) thead{display:none;}
    table:not(.matrixTable), table:not(.matrixTable) tbody, table:not(.matrixTable) tr, table:not(.matrixTable) td{display:block;width:100%;}
    table:not(.matrixTable) tr{border-bottom:2px solid var(--line);padding:10px 0;}
    table:not(.matrixTable) td{border:none;padding:4px 0;display:flex;justify-content:space-between;gap:10px;}
    table:not(.matrixTable) td::before{content:attr(data-label);font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;flex-shrink:0;}
    .matrixTable{font-size:.78rem;}
    .matrixTable th, .matrixTable td{padding:8px 10px;white-space:nowrap;}
    .rowActions{justify-content:flex-end;}
  }
  @media print{
    header, .tabs, .toolbar, footer, .rowActions{display:none !important;}
    body{background:#fff;}
    .card{border:1px solid #999;box-shadow:none;break-inside:avoid;}
    main{padding:0;max-width:100%;}
  }
</style>

<script>
/* ================== STORAGE (persists on this hosted site via localStorage) ================== */
function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
function lsRemove(key){ try{ localStorage.removeItem(key); }catch(e){} }


/* ================== OFFLINE-FIRST CACHE ================== */
// Every entity list is cached locally after a successful fetch, and shown
// immediately on next load (even with no internet) while a fresh copy is
// fetched quietly in the background.
function loadCache(entity){
  try{
    const raw = localStorage.getItem('cf_cache_'+entity);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveCache(entity, data){
  try{
    localStorage.setItem('cf_cache_'+entity, JSON.stringify(data));
    localStorage.setItem('cf_cache_'+entity+'_time', String(Date.now()));
  }catch(e){}
}
function cacheTime(entity){
  try{ return parseInt(localStorage.getItem('cf_cache_'+entity+'_time')||'0',10); }catch(e){ return 0; }
}
function timeAgo(ms){
  if(!ms) return '';
  const diff = Math.max(0, Date.now()-ms);
  const mins = Math.floor(diff/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+' min ago';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+' hr ago';
  return Math.floor(hrs/24)+' day(s) ago';
}
let syncStatusTimer = null;
function setSyncStatus(state, entity){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  clearTimeout(syncStatusTimer);
  if(state==='synced'){
    el.textContent = '● Synced just now';
    el.style.color = 'var(--ok)';
  } else if(state==='offline'){
    el.textContent = '● Offline — showing last synced data ('+timeAgo(cacheTime(entity))+')';
    el.style.color = 'var(--warn)';
  } else if(state==='syncing'){
    el.textContent = '● Syncing…';
    el.style.color = 'var(--muted)';
  } else if(state==='nodata'){
    el.textContent = '● No internet connection — no data cached yet';
    el.style.color = 'var(--danger)';
  }
}
// Generic offline-first loader: shows cached data instantly, then fetches
// fresh data in the background without blocking the screen.
const entitySyncInProgress = {};
async function loadEntityOfflineFirst(entity, applyFn, renderFn){
  const cached = loadCache(entity);
  if(cached){
    applyFn(cached);
    renderFn();
    setSyncStatus('syncing', entity);
  } else {
    app.innerHTML = '<div class="loading">Loading...</div>';
  }

  if(entitySyncInProgress[entity]) return; // don't stack up duplicate syncs (e.g. rapid pull-to-refresh)

  if(!navigator.onLine){
    if(cached){
      setSyncStatus('offline', entity);
      showToast('No internet connection. Showing last synced data.', 2200);
    } else {
      setSyncStatus('nodata', entity);
      app.innerHTML = '<div class="empty"><h3>No internet connection</h3><p>Initial data cannot be loaded yet. Please connect to the internet and try again.</p><button class="btn-primary" onclick="loadCurrentView()">Retry</button></div>';
    }
    return;
  }

  entitySyncInProgress[entity] = true;
  try{
    const fresh = await apiList(entity);
    applyFn(fresh);
    saveCache(entity, fresh);
    renderFn();
    setSyncStatus('synced', entity);
    if(cached) showToast('Latest data synced ✅', 1500);
  }catch(err){
    if(cached){
      setSyncStatus('offline', entity);
      showToast('Unable to sync. Showing last synced data.', 2200);
    } else {
      setSyncStatus('nodata', entity);
      app.innerHTML = '<div class="empty"><h3>No internet connection</h3><p>Could not load data and nothing is cached yet on this device. Please connect to the internet and try again.</p><button class="btn-primary" onclick="loadCurrentView()">Retry</button></div>';
    }
  } finally {
    entitySyncInProgress[entity] = false;
  }
}

let WEBAPP_URL = lsGet('cf_webapp_url') || 'https://script.google.com/macros/s/AKfycbzRJ5vwe2IECh7U4rVcmpBzso58GiY7mkE5S98fqj9zxduvSXLh2tOUq0oaVy1Cp-wZ/exec';
function saveConfig(url){ WEBAPP_URL = url; lsSet('cf_webapp_url', url); }

/* ================== SIMPLE HASH (for PIN / security answer, not for storing customer data) ================== */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ================== STATE ================== */
let customers = [];
let filterStatus = 'ALL';
let searchText = '';

const STATUS_LIST = [
  {key:'New', label:'New', cls:'b-new'},
  {key:'Appointment Fixed', label:'Appointment Fixed', cls:'b-appt'},
  {key:'Postponed', label:'Postponed', cls:'b-postponed'},
  {key:'Met - Interested', label:'Met - Interested', cls:'b-metint'},
  {key:'Met - Not Interested', label:'Met - Not Interested', cls:'b-metno'},
  {key:'Not Reachable', label:'Not Reachable', cls:'b-missed'},
  {key:'Converted', label:'Converted ✅', cls:'b-converted'},
  {key:'Rejected', label:'Rejected', cls:'b-rejected'}
];
function statusMeta(key){ return STATUS_LIST.find(s=>s.key===key) || {label:key,cls:'b-new'}; }

const INSURANCE_TYPES = ['Life Insurance','Health Insurance','Motor Insurance'];
const INSURANCE_COMPANIES = {
  'Life Insurance': ['LIC','Axis Max Life','Tata AIA','Other'],
  'Health Insurance': ['Care Health','Tata AIG','Other'],
  'Motor Insurance': ['Tata AIG','SBI General','Go Digit','Other']
};
const REALESTATE_TYPES = ['Red Sandal Farm Lands','Open Plots','Apartments','Other'];

/* ================== API ================== */
async function apiList(entity){
  const res = await fetch(WEBAPP_URL + '?action=list&entity=' + entity);
  const data = await res.json();
  if(!data.success) throw new Error(data.message||'Could not load data');
  return data.data;
}
async function apiSend(payload){
  const res = await fetch(WEBAPP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!data.success) throw new Error(data.message||'Could not save');
  return data;
}
async function apiAdd(entity, record){ return apiSend({action:'add', entity, record}); }
async function apiUpdate(entity, record){ return apiSend({action:'update', entity, record}); }
async function apiDelete(entity, id){ return apiSend({action:'delete', entity, id}); }
async function apiBulkAdd(entity, records){ return apiSend({action:'bulkAdd', entity, records}); }

/* ================== RENDER ================== */
const app = document.getElementById('app');

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normDate(v){
  if(!v) return '';
  return String(v).substring(0,10); // strip any leftover time component
}
function addDaysStr(baseStr, n){
  const d = new Date(baseStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function prettyDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}
function followupTag(dateStr){
  dateStr = normDate(dateStr);
  if(!dateStr) return '';
  const today = todayStr();
  if(dateStr < today) return '<div class="followup-tag fu-overdue"><span class="tagLabel">⚠ Missed Follow-up</span><span class="tagDate">'+dateStr+'</span></div>';
  if(dateStr === today) return '<div class="followup-tag fu-today"><span class="tagLabel">📅 Follow-up</span><span class="tagDate">Today</span></div>';
  return '<div class="followup-tag fu-future"><span class="tagLabel">Follow-up</span><span class="tagDate">'+dateStr+'</span></div>';
}
function appointmentTag(dateStr){
  dateStr = normDate(dateStr);
  if(!dateStr) return '';
  const today = todayStr();
  let cls = 'fu-future';
  if(dateStr < today) cls = 'fu-overdue';
  else if(dateStr === today) cls = 'fu-today';
  return '<div class="followup-tag '+cls+'"><span class="tagLabel">📅 Appointment</span><span class="tagDate">'+dateStr+'</span></div>';
}

function eventsForDate(dateStr){
  // Returns customers whose Appointment or NextFollowup falls on dateStr, tagged by type
  const items = [];
  customers.forEach(c=>{
    const appt = normDate(c.AppointmentDate);
    const next = normDate(c.NextFollowupDate);
    if(appt === dateStr) items.push({c, type:'appt'});
    if(next === dateStr && next !== appt) items.push({c, type:'followup'});
  });
  return items;
}

function renderUpcoming(){
  const d0 = todayStr();
  const d1 = addDaysStr(d0,1);
  const d2 = addDaysStr(d0,2);
  const cols = [
    {cls:'today', label:'Today', date:d0},
    {cls:'tomorrow', label:'Tomorrow', date:d1},
    {cls:'dayafter', label:'Day After Tomorrow', date:d2}
  ];
  let html = '<div class="upcomingWrap"><div class="upcomingTitle">📅 Today &amp; Upcoming (Next 3 Days)</div><div class="upcomingGrid">';
  cols.forEach(col=>{
    const items = eventsForDate(col.date);
    html += `<div class="upcomingCol ${col.cls}">
      <div class="upcomingColHead">
        <div><div class="dlabel">${col.label}</div><div class="ddate">${prettyDate(col.date)}</div></div>
        <div class="upcomingCount">${items.length}</div>
      </div>`;
    if(items.length===0){
      html += '<div class="upcomingEmpty">Nothing scheduled</div>';
    } else {
      items.forEach(({c,type})=>{
        const svc = serviceSummary(c);
        html += `<div class="upcomingItem" onclick="openUpdate('${c.ID}')">
          <div class="uName">${escapeHtml(c.Name)}</div>
          <div class="uPhone">${escapeHtml(c.Phone)}${phoneActionsHtml(c.Phone, c.Name)}</div>
          ${svc?'<div class="uService">'+escapeHtml(svc)+'</div>':(c.Category?'<div class="uService">'+escapeHtml(c.Category)+'</div>':'')}
          <span class="upcomingTag ${type==='appt'?'tag-appt':'tag-followup'}">${type==='appt'?'Appointment':'Follow-up'}</span>
          <div style="margin-top:6px;">${customerReminderHtml(c)}</div>
        </div>`;
      });
    }
    html += `</div>`;
  });
  html += '</div></div>';
  return html;
}

function renderStats(){
  const counts = {};
  STATUS_LIST.forEach(s=>counts[s.key]=0);
  customers.forEach(c=>{ if(counts[c.Status]!==undefined) counts[c.Status]++; });
  const today = todayStr();
  const overdue = customers.filter(c=>{ const nd=normDate(c.NextFollowupDate); return nd && nd < today; }).length;
  const scheduled = customers.filter(c=>{ const nd=normDate(c.NextFollowupDate); return nd && nd >= today; }).length;

  let html = '<div class="stats">';
  html += statCard('ALL', 'Total Customers', customers.length, '👥', '#2b5c8f');
  html += statCard('Appointment Fixed', 'Appointment Fixed', counts['Appointment Fixed'], '📌', '#0f7a6b');
  html += statCard('HASFOLLOWUP', 'Follow-Ups Scheduled', scheduled, '📅', '#b8862d');
  html += statCard('OVERDUE', 'Missed Follow-ups', overdue, '⚠️', '#b3402f');
  html += statCard('New', 'New', counts['New'], '✨', '#5b6fd6');
  html += statCard('Postponed', 'Postponed', counts['Postponed'], '⏳', '#c98a2c');
  html += statCard('Met - Interested', 'Met - Interested', counts['Met - Interested'], '🙂', '#1f7a4d');
  html += statCard('Met - Not Interested', 'Met - Not Interested', counts['Met - Not Interested'], '😐', '#a15c3e');
  html += statCard('Not Reachable', 'Not Reachable', counts['Not Reachable'], '📵', '#c9622f');
  html += statCard('Converted', 'Converted', counts['Converted'], '✅', '#1f7a4d');
  html += statCard('Rejected', 'Rejected', counts['Rejected'], '❌', '#8a8378');
  html += '</div>';
  return html;
}
function statCard(key,label,num,icon,color){
  const active = filterStatus===key ? ' active' : '';
  const style = color ? ' style="--sc:'+color+'"' : '';
  return '<div class="stat'+active+'"'+style+' onclick="setFilter(\''+key+'\')">'+(icon?'<span class="icon">'+icon+'</span>':'')+'<div class="num">'+num+'</div><div class="lbl">'+label+'</div></div>';
}

function renderToolbar(){
  let opts = '<option value="ALL">All Stages</option>';
  STATUS_LIST.forEach(s=> opts += '<option value="'+s.key+'"'+(filterStatus===s.key?' selected':'')+'>'+s.label+'</option>');
  return `<div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search by name or phone..." value="${escapeAttr(searchText)}">
    <select id="statusFilterSel">${opts}</select>
    <button class="btn-outline" onclick="downloadCustomerTemplate()">⬇️ Template</button>
    <button class="btn-secondary" onclick="document.getElementById('importFileInput').click()">📥 Import Excel/CSV</button>
    <input type="file" id="importFileInput" accept=".csv" style="display:none" onchange="handleImportFile(event)">
  </div>`;
}

function getFiltered(){
  return customers.filter(c=>{
    if(filterStatus==='OVERDUE'){
      const nd = normDate(c.NextFollowupDate);
      if(!(nd && nd < todayStr())) return false;
    } else if(filterStatus==='HASFOLLOWUP'){
      const nd = normDate(c.NextFollowupDate);
      if(!(nd && nd >= todayStr())) return false;
    } else if(filterStatus!=='ALL' && c.Status!==filterStatus) return false;
    if(searchText){
      const t = searchText.toLowerCase();
      if(!(String(c.Name||'').toLowerCase().includes(t) || String(c.Phone||'').includes(t))) return false;
    }
    return true;
  }).sort((a,b)=>{
    const da = normDate(a.NextFollowupDate) || '9999';
    const db = normDate(b.NextFollowupDate) || '9999';
    return da.localeCompare(db);
  });
}

function serviceSummary(c){
  if(c.Category==='Insurance'){
    return [c.SubCategory, c.Company].filter(Boolean).join(' · ');
  }
  if(c.Category==='Real Estate'){
    return c.SubCategory || '';
  }
  return '';
}
function customerReminderHtml(c){
  const dateVal = c.AppointmentDate || c.NextFollowupDate;
  if(!dateVal) return '';
  const label = c.AppointmentDate ? 'Appointment' : 'Follow-up';
  const title = c.Name+' - '+label+(serviceSummary(c)?' ('+serviceSummary(c)+')':'');
  const link = gcalLink(title, dateVal, '', c.Notes||'', '');
  return `<a href="${escapeAttr(link)}" target="_blank" rel="noopener" class="btn-outline" onclick="event.stopPropagation()" style="display:inline-block;text-decoration:none;padding:6px 10px;font-size:.78rem;">🔔 Remind Me</a>`;
}

function renderTable(){
  const list = getFiltered();
  if(list.length===0){
    return '<div class="card"><div class="empty"><h3>No customers found</h3><p>Click "+ New Customer" above to add one.</p></div></div>';
  }
  let rows = list.map(c=>{
    const sm = statusMeta(c.Status);
    const svc = serviceSummary(c);
    return `<tr>
      <td data-label="Name"><div class="name-cell">${escapeHtml(c.Name)}</div><div class="phone-cell">${escapeHtml(c.Category||'')}</div>${svc?'<div class="sub-cell">'+escapeHtml(svc)+'</div>':''}</td>
      <td data-label="Phone">${escapeHtml(c.Phone)}${phoneActionsHtml(c.Phone, c.Name)}</td>
      <td data-label="Stage"><span class="badge ${sm.cls}">${sm.label}</span></td>
      <td data-label="Follow-up">${appointmentTag(c.AppointmentDate)}${followupTag(c.NextFollowupDate)}${customerReminderHtml(c)}</td>
      <td data-label="Notes">${escapeHtml(c.Notes||'')}</td>
      <td data-label="Actions"><div class="rowActions">
        <button class="btn-secondary" onclick="openUpdate('${c.ID}')">Update</button>
        <button class="btn-outline" onclick="openHistory('${c.ID}','${escapeAttr(c.Name)}')">History</button>
        <button class="btn-danger" onclick="removeCustomer('${c.ID}','${escapeAttr(c.Name)}')">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
  return `<div class="card"><table>
    <thead><tr><th>Name</th><th>Phone</th><th>Stage</th><th>Follow-up</th><th>Notes</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function render(){
  app.innerHTML = renderUpcoming() + renderStats() + renderToolbar() + renderTable();
  document.getElementById('searchBox').addEventListener('input', e=>{ searchText = e.target.value; render(); });
  document.getElementById('statusFilterSel').addEventListener('change', e=>{ filterStatus = e.target.value; render(); });
}
function setFilter(key){ filterStatus = key; render(); }

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

  const cat = values.Category || 'Insurance';
  let html = '';
  if(cat === 'Insurance'){
    const type = values.SubCategory || INSURANCE_TYPES[0];
    const companies = INSURANCE_COMPANIES[type] || [];
    html += `<div class="field"><label>Insurance Type</label><select id="f_subcategory" onchange="onSubcategoryChange()">`
      + INSURANCE_TYPES.map(t=>`<option value="${t}" ${type===t?'selected':''}>${t}</option>`).join('')
      + `</select></div>`;
    html += `<div class="field"><label>Company</label><select id="f_company">`
      + companies.map(co=>`<option value="${co}" ${values.Company===co?'selected':''}>${co}</option>`).join('')
      + `</select></div>`;
  } else if(cat === 'Real Estate'){
    html += `<div class="field"><label>Property Type</label><select id="f_subcategory">`
      + REALESTATE_TYPES.map(t=>`<option value="${t}" ${values.SubCategory===t?'selected':''}>${t}</option>`).join('')
      + `</select></div>`;
  }
  return html;
}

function onCategoryChange(){
  const cat = document.getElementById('f_category').value;
  document.getElementById('categoryFieldsWrap').innerHTML = categoryFieldsHtml({Category:cat});
}
function onSubcategoryChange(){
  const type = document.getElementById('f_subcategory').value;
  const companies = INSURANCE_COMPANIES[type] || [];
  const sel = document.getElementById('f_company');
  if(sel){
    sel.innerHTML = companies.map(co=>`<option value="${co}">${co}</option>`).join('');
  }
}

function findDuplicatePhone(phone, excludeId){
  const digits = String(phone||'').replace(/[^\d]/g,'');
  if(!digits) return null;
  return customers.find(c=> c.ID!==excludeId && String(c.Phone||'').replace(/[^\d]/g,'')===digits) || null;
}
function openAdd(){
  showModal({
    title:'Add New Customer',
    hint:'Fill in the customer details',
    values:{Status:'New', Category:'Insurance'},
    onSave: async (vals)=>{
      const dup = findDuplicatePhone(vals.Phone);
      if(dup){
        const proceed = confirm('⚠️ A customer with this phone number already exists:\n\n'+dup.Name+' ('+dup.Phone+')\n\nAdd this as a new, separate customer anyway?');
        if(!proceed){
          const btn = document.getElementById('saveBtn');
          if(btn){ btn.disabled=false; btn.textContent='Save'; }
          return;
        }
      }
      const res = await apiAdd('customers', vals);
      customers.push({...vals, ID:res.id});
      saveCache('customers', customers);
      showToast('Customer saved ✅');
      closeModal();
      render();
    }
  });
}
function openUpdate(id){
  const c = customers.find(x=>x.ID===id);
  if(!c) return;
  showModal({
    title: c.Name + ' - Update',
    hint:'Record what happened with this customer',
    values: c,
    isUpdate:true,
    onSave: async (vals)=>{
      vals.ID = id;
      await apiUpdate('customers', vals);
      const idx = customers.findIndex(x=>x.ID===id);
      if(idx!==-1) customers[idx] = {...customers[idx], ...vals};
      saveCache('customers', customers);
      showToast('Update saved ✅');
      closeModal();
      render();
    }
  });
}
async function removeCustomer(id,name){
  if(!confirm('Delete '+name+'? This cannot be undone.')) return;
  try{
    await apiDelete('customers', id);
    customers = customers.filter(c=>c.ID!==id);
    saveCache('customers', customers);
    showToast('Deleted');
    render();
  }catch(err){ showToast('Error: '+err.message); }
}

async function openHistory(id, name){
  const html = `<div class="overlay" id="overlay"><div class="modal">
    <h2>🕒 ${escapeHtml(name)} - History</h2>
    <div class="hint">Timeline of every update for this customer</div>
    <div id="historyBody"><div class="loading">Loading...</div></div>
    <div class="modalActions"><button class="btn-outline" onclick="closeModal()">Close</button></div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  try{
    const all = await apiList('history');
    const entries = all.filter(h=>h.CustomerID===id).sort((a,b)=> String(b.Timestamp||'').localeCompare(String(a.Timestamp||'')));
    const body = document.getElementById('historyBody');
    if(!body) return; // modal closed before load finished
    if(entries.length===0){
      body.innerHTML = '<div class="upcomingEmpty">No history yet.</div>';
      return;
    }
    body.innerHTML = entries.map(h=>{
      const sm = statusMeta(h.Status);
      const ts = String(h.Timestamp||'').replace('T',' ');
      return `<div class="historyEntry">
        <div class="historyTime">${escapeHtml(ts)}</div>
        <span class="badge ${sm.cls}">${sm.label}</span>
        ${h.NextFollowupDate?'<div class="sub-cell">Next follow-up: '+escapeHtml(h.NextFollowupDate)+'</div>':''}
        ${h.Notes?'<div class="historyNotes">'+escapeHtml(h.Notes)+'</div>':''}
      </div>`;
    }).join('');
  }catch(err){
    const body = document.getElementById('historyBody');
    if(body) body.innerHTML = '<div class="upcomingEmpty">Could not load history: '+escapeHtml(err.message)+'</div>';
  }
}

/* ================== BULK IMPORT (CSV) ================== */
const IMPORT_COLUMNS = ['Name','Phone','Category','SubCategory','Company','Status','AppointmentDate','NextFollowupDate','Notes'];
function downloadCustomerTemplate(){
  const sample = [
    'Name,Phone,Category,SubCategory,Company,Status,AppointmentDate,NextFollowupDate,Notes',
    'Ravi Kumar,9876543210,Insurance,Health Insurance,Care Health,New,,2026-08-20,Interested in family floater plan',
    'Lakshmi Devi,9123456780,Real Estate,Open Plots,,New,,2026-08-22,Looking for plots near Guntur'
  ].join('\n');
  const blob = new Blob([sample], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'customer_import_template.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && next==='\n') i++;
        row.push(field); field=''; rows.push(row); row=[];
      } else field+=c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.length>1 || (r.length===1 && r[0]!==''));
}
function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const rows = parseCSV(e.target.result);
      if(rows.length<2){ alert('The file has no data rows.'); return; }
      const headerRow = rows[0].map(h=>h.trim());
      const idx = {};
      headerRow.forEach((h,i)=>{ idx[h.toLowerCase()] = i; });
      const records = [];
      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        if(row.every(v=>String(v).trim()==='')) continue;
        const get = (col)=>{
          const i = idx[col.toLowerCase()];
          return i!==undefined ? String(row[i]||'').trim() : '';
        };
        const name = get('Name'), phone = get('Phone');
        if(!name || !phone) continue;
        records.push({
          Name:name, Phone:phone,
          Category: get('Category')||'Insurance',
          SubCategory: get('SubCategory'),
          Company: get('Company'),
          Status: get('Status')||'New',
          AppointmentDate: get('AppointmentDate'),
          NextFollowupDate: get('NextFollowupDate'),
          Notes: get('Notes')
        });
      }
      if(records.length===0){ alert('No valid rows found. Make sure Name and Phone columns are filled in.'); return; }
      const dupCount = records.filter(r=> findDuplicatePhone(r.Phone)).length;
      let msg = 'Import '+records.length+' customers? This will add them to your Google Sheet.';
      if(dupCount>0) msg += '\n\n⚠️ '+dupCount+' of these phone numbers already exist in your customer list. They will be added as new, separate entries unless you cancel and check your file.';
      if(!confirm(msg)) { event.target.value=''; return; }
      showToast('Importing '+records.length+' customers...');
      await apiBulkAdd('customers', records);
      showToast(records.length+' customers imported ✅');
      event.target.value = '';
      refreshCustomers();
    }catch(err){
      alert('Import failed: '+err.message);
    }
  };
  reader.readAsText(file);
}

    }
  });
}
function closeModal(){
  const o = document.getElementById('overlay');
  if(o) o.remove();
}

/* ================== TOAST ================== */
let toastTimer;
function showToast(msg, duration){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), duration||2500);
}

/* ================== VIEW SWITCHING ================== */
let currentView = 'home';
function switchView(view){
  currentView = view;
  document.querySelectorAll('.tabBtn').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  updateAddButton();
  loadCurrentView();
}
function updateAddButton(){
  const btn = document.getElementById('addBtn');
  if(currentView==='customers'){ btn.style.display=''; btn.textContent='+ New Customer'; btn.onclick=openAdd; }
  else if(currentView==='meetings'){ btn.style.display=''; btn.textContent='+ New Meeting'; btn.onclick=openAddMeeting; }
  else if(currentView==='todos'){ btn.style.display=''; btn.textContent='+ New Task'; btn.onclick=openAddTodo; }
  else { btn.style.display='none'; }
}
function loadCurrentView(){
  if(currentView==='home') refreshHome();
  else if(currentView==='customers') refreshCustomers();
  else if(currentView==='meetings') refreshMeetings();
  else if(currentView==='todos') refreshTodos();
  else if(currentView==='reports') refreshReports();
}

/* ================== PHONE SHORTCUTS (Call / WhatsApp) ================== */
function cleanPhoneForWa(phone){
  let d = String(phone||'').replace(/[^\d]/g,'');
  if(d.length===10) d = '91'+d; // assume India if no country code given
  return d;
}
function telLink(phone){ return 'tel:'+String(phone||'').replace(/[^\d+]/g,''); }
function mapsLink(location){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(location); }
function locationHtml(location){
  if(!location) return '';
  return '📍 <a href="'+escapeAttr(mapsLink(location))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--teal);text-decoration:underline;">'+escapeHtml(location)+'</a>';
}
function waLink(phone, msg){
  const d = cleanPhoneForWa(phone);
  return 'https://wa.me/'+d+(msg?('?text='+encodeURIComponent(msg)):'');
}
function phoneActionsHtml(phone, name){
  if(!phone) return '';
  const msg = name ? ('Hi '+name+', ') : 'Hi, ';
  return `<div class="phoneActions" onclick="event.stopPropagation()">
    <a href="${escapeAttr(telLink(phone))}" class="phoneBtn phoneCall" title="Call">📞</a>
    <a href="${escapeAttr(waLink(phone,msg))}" target="_blank" rel="noopener" class="phoneBtn phoneWa" title="WhatsApp">💬</a>
  </div>`;
}

/* ================== MEETINGS ================== */
let meetings = [];
let meetingFilterType = 'Pending';
const MEETING_PLATFORMS = ['Google Meet','Zoom','Google Teams','Other'];
const MEETING_COMPANIES = ['LIC','Care Health','Axis Max Life','NSP','NJ Wealth','CSC','Other'];
const MEETING_STATUS_LIST = [
  {key:'Pending', label:'Pending', cls:'b-appt'},
  {key:'Completed', label:'Completed', cls:'b-converted'},
  {key:'Postponed', label:'Postponed', cls:'b-postponed'},
  {key:'Cancelled', label:'Cancelled', cls:'b-rejected'}
];
function meetingStatusMeta(status){ return MEETING_STATUS_LIST.find(s=>s.key===(status||'Pending')) || MEETING_STATUS_LIST[0]; }

async function refreshMeetings(){
  await loadEntityOfflineFirst('meetings', (data)=>{ meetings = data; }, renderMeetingsView);
}

function dtDate(v){ return v ? String(v).substring(0,10) : ''; }
function dtPretty(v){
  if(!v) return '';
  const parts = String(v).split('T');
  if(parts.length<2) return v;
  const d = new Date(parts[0]+'T00:00:00');
  const dateLabel = d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  return dateLabel + ' · ' + parts[1];
}

function meetingUpcomingPanel(){
  const d0 = todayStr(), d1 = addDaysStr(d0,1), d2 = addDaysStr(d0,2);
  const cols = [
    {cls:'today', label:'Today', date:d0},
    {cls:'tomorrow', label:'Tomorrow', date:d1},
    {cls:'dayafter', label:'Day After Tomorrow', date:d2}
  ];
  let html = '<div class="upcomingWrap"><div class="upcomingTitle">📅 Meetings - Today &amp; Upcoming (Next 3 Days)</div><div class="upcomingGrid">';
  cols.forEach(col=>{
    const items = meetings.filter(m=> dtDate(m.StartDateTime)===col.date && (m.Status||'Pending')!=='Completed' && (m.Status||'Pending')!=='Cancelled');
    html += `<div class="upcomingCol ${col.cls}"><div class="upcomingColHead"><div><div class="dlabel">${col.label}</div><div class="ddate">${prettyDate(col.date)}</div></div><div class="upcomingCount">${items.length}</div></div>`;
    if(items.length===0){ html += '<div class="upcomingEmpty">Nothing scheduled</div>'; }
    else {
      items.forEach(m=>{
        html += `<div class="upcomingItem" onclick="openUpdateMeeting('${m.ID}')">
          <div class="uName">${escapeHtml(m.MeetingWith)}</div>
          <div class="uPhone">${escapeHtml(m.Company||'')}${m.Type==='Offline'&&m.Location?' · '+locationHtml(m.Location):''}</div>
          <span class="upcomingTag ${m.Type==='Online'?'tag-appt':'tag-followup'}">${m.Type==='Online'?('Online · '+escapeHtml(m.Platform||'')):'Offline'}</span>
        </div>`;
      });
    }
    html += `</div>`;
  });
  html += '</div></div>';
  return html;
}

function renderMeetingsStats(){
  const today = todayStr();
  const total = meetings.length;
  const todayCount = meetings.filter(m=>dtDate(m.StartDateTime)===today).length;
  const online = meetings.filter(m=>m.Type==='Online').length;
  const offline = meetings.filter(m=>m.Type==='Offline').length;
  const pending = meetings.filter(m=>(m.Status||'Pending')==='Pending').length;
  const completed = meetings.filter(m=>m.Status==='Completed').length;
  const postponed = meetings.filter(m=>m.Status==='Postponed').length;
  const cancelled = meetings.filter(m=>m.Status==='Cancelled').length;
  let html = '<div class="stats">';
  html += statCardM('ALL','Total Meetings', total, '🤝', '#2b5c8f');
  html += statCardM('TODAY','Today', todayCount, '📅', '#b8862d');
  html += statCardM('Pending','Pending', pending, '⏳', '#0f7a6b');
  html += statCardM('Completed','Completed', completed, '✅', '#1f7a4d');
  html += statCardM('Postponed','Postponed', postponed, '⏸️', '#c98a2c');
  html += statCardM('Cancelled','Cancelled', cancelled, '❌', '#b3402f');
  html += statCardM('Online','Online', online, '💻', '#0f7a6b');
  html += statCardM('Offline','Offline', offline, '🏢', '#8a5a4a');
  html += '</div>';
  return html;
}
function statCardM(key,label,num,icon,color){
  const active = meetingFilterType===key ? ' active' : '';
  return '<div class="stat'+active+'" style="--sc:'+color+'" onclick="setMeetingFilter(\''+key+'\')"><span class="icon">'+icon+'</span><div class="num">'+num+'</div><div class="lbl">'+label+'</div></div>';
}
function setMeetingFilter(key){ meetingFilterType = key; renderMeetingsView(); }

function getFilteredMeetings(){
  return meetings.filter(m=>{
    const status = m.Status || 'Pending';
    if(meetingFilterType==='TODAY') return dtDate(m.StartDateTime)===todayStr();
    if(meetingFilterType==='Online'||meetingFilterType==='Offline') return m.Type===meetingFilterType;
    if(['Pending','Completed','Postponed','Cancelled'].indexOf(meetingFilterType)!==-1) return status===meetingFilterType;
    return true; // 'ALL'
  }).sort((a,b)=> String(a.StartDateTime||'9999').localeCompare(String(b.StartDateTime||'9999')));
}

// Formats a start/end datetime-local pair into a readable range, e.g.
// "10 Aug 2026, 1:00 PM – 3:00 PM" or, if different days, both full dates.
function dtRangePretty(startV, endV){
  if(!startV) return '';
  const [sDate, sTime] = String(startV).split('T');
  if(!sTime) return startV;
  const d = new Date(sDate+'T00:00:00');
  const dateLabel = d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  const fmtTime = (t)=>{
    if(!t) return '';
    let [h,mi] = t.split(':').map(Number);
    const ap = h>=12 ? 'PM' : 'AM';
    h = h%12; if(h===0) h=12;
    return h+':'+String(mi).padStart(2,'0')+' '+ap;
  };
  if(!endV) return dateLabel+', '+fmtTime(sTime);
  const [eDate, eTime] = String(endV).split('T');
  if(eDate===sDate){
    return dateLabel+', '+fmtTime(sTime)+' – '+fmtTime(eTime);
  }
  const d2 = new Date(eDate+'T00:00:00');
  const dateLabel2 = d2.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  return dateLabel+' '+fmtTime(sTime)+' – '+dateLabel2+' '+fmtTime(eTime);
}

// Builds a Google Calendar "quick add event" link so the user gets Google's
// own reminder/notification before the meeting or task time.
function gcalLink(title, startV, endV, details, location){
  const toGcal = (v)=>{
    if(!v) return '';
    const [d,t] = String(v).split('T');
    if(!d) return '';
    const dd = d.replace(/-/g,'');
    const tt = t ? t.replace(':','')+'00' : '090000';
    return dd+'T'+tt;
  };
  let s = toGcal(startV);
  let e = toGcal(endV);
  if(!e && s){
    // default 30-minute event if no end time given
    const [d,t] = String(startV).split('T');
    const dt = new Date(d+'T'+(t||'09:00')+':00');
    dt.setMinutes(dt.getMinutes()+30);
    e = dt.getFullYear()+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0')+'T'+String(dt.getHours()).padStart(2,'0')+String(dt.getMinutes()).padStart(2,'0')+'00';
  }
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text: title || '',
    details: details || '',
    location: location || ''
  });
  if(s && e) params.set('dates', s+'/'+e);
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}

function renderMeetingsTable(){
  const list = getFilteredMeetings();
  if(list.length===0){
    return '<div class="card"><div class="empty"><h3>No meetings found</h3><p>Click "+ New Meeting" above to add one.</p></div></div>';
  }
  let rows = list.map(m=>{
    const joinBtn = (m.Type==='Online' && m.MeetingLink) ? `<a href="${escapeAttr(m.MeetingLink)}" target="_blank" rel="noopener" class="btn-secondary" style="display:inline-block;text-decoration:none;padding:6px 10px;font-size:.78rem;margin-bottom:4px;">Join</a>` : '';
    const remindLink = m.StartDateTime ? `<a href="${escapeAttr(gcalLink(m.MeetingWith+' ('+(m.Company||'Meeting')+')', m.StartDateTime, m.EndDateTime, m.Remarks||'', m.Type==='Offline'?(m.Location||''):(m.MeetingLink||'')))}" target="_blank" rel="noopener" class="btn-outline" style="display:inline-block;text-decoration:none;padding:6px 10px;font-size:.78rem;">🔔 Remind Me</a>` : '';
    const sm = meetingStatusMeta(m.Status);
    return `<tr>
      <td data-label="Meeting With"><div class="name-cell">${escapeHtml(m.MeetingWith)}</div><div class="sub-cell">${escapeHtml(m.Company||'')}</div>${m.Type==='Offline'&&m.Location?'<div class="sub-cell">'+locationHtml(m.Location)+'</div>':''}</td>
      <td data-label="Type"><span class="badge ${m.Type==='Online'?'b-appt':'b-postponed'}">${escapeHtml(m.Type||'')}</span>${m.Type==='Online'?'<div class="sub-cell">'+escapeHtml(m.Platform||'')+'</div>':''}</td>
      <td data-label="Status"><span class="badge ${sm.cls}">${sm.label}</span></td>
      <td data-label="Date & Time">${escapeHtml(dtRangePretty(m.StartDateTime, m.EndDateTime))}</td>
      <td data-label="Link">${joinBtn}${remindLink}</td>
      <td data-label="Remarks">${escapeHtml(m.Remarks||'')}</td>
      <td data-label="Actions"><div class="rowActions">
        ${sm.key!=='Completed' ? `<button class="btn-secondary" onclick="quickMeetingStatus('${m.ID}','Completed')">Mark Completed</button>` : ''}
        <button class="btn-outline" onclick="openUpdateMeeting('${m.ID}')">Update</button>
        <button class="btn-danger" onclick="removeMeeting('${m.ID}','${escapeAttr(m.MeetingWith)}')">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
  return `<div class="card"><table>
    <thead><tr><th>Meeting With</th><th>Type</th><th>Status</th><th>Date &amp; Time</th><th>Link</th><th>Remarks</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderMeetingsView(){
  app.innerHTML = meetingUpcomingPanel() + renderMeetingsStats() + renderMeetingsTable();
}

function meetingFieldsHtml(values){
  const type = values.Type || 'Online';
  let html = `<div class="field"><label>Meeting Type</label><select id="mf_type" onchange="onMeetingTypeChange()">
    <option value="Online" ${type==='Online'?'selected':''}>Online</option>
    <option value="Offline" ${type==='Offline'?'selected':''}>Offline</option>
  </select></div>`;
  html += `<div id="meetingTypeWrap">${meetingTypeFieldsHtml(values)}</div>`;
  return html;
}
function meetingTypeFieldsHtml(values){
  const type = values.Type || 'Online';
  if(type==='Online'){
    const platform = values.Platform || MEETING_PLATFORMS[0];
    let html = `<div class="field"><label>Platform</label><select id="mf_platform">`
      + MEETING_PLATFORMS.map(p=>`<option value="${p}" ${platform===p?'selected':''}>${p}</option>`).join('')
      + `</select></div>`;
    html += `<div class="field"><label>Meeting Link</label><input type="text" id="mf_link" value="${escapeAttr(values.MeetingLink||'')}" placeholder="https://meet.google.com/..."></div>`;
    return html;
  }
  return `<div class="field"><label>Meeting Location <span style="font-weight:400;color:var(--muted);">(optional)</span></label><input type="text" id="mf_location" value="${escapeAttr(values.Location||'')}" placeholder="Office address / place name (optional)"></div>`;
}
function onMeetingTypeChange(){
  const type = document.getElementById('mf_type').value;
  document.getElementById('meetingTypeWrap').innerHTML = meetingTypeFieldsHtml({Type:type});
}
function meetingCompanyFieldHtml(values){
  const isOther = values.Company && MEETING_COMPANIES.indexOf(values.Company)===-1;
  let html = `<div class="field"><label>Company</label><select id="mf_company" onchange="onMeetingCompanyChange()">`
    + MEETING_COMPANIES.map(c=>`<option value="${c}" ${(isOther? c==='Other' : values.Company===c)?'selected':''}>${c}</option>`).join('')
    + `</select></div>`;
  html += `<div class="field" id="mf_companyOtherWrap" style="${isOther?'':'display:none;'}"><label>Specify Company</label><input type="text" id="mf_companyOther" value="${isOther?escapeAttr(values.Company):''}" placeholder="Company name"></div>`;
  return html;
}
function onMeetingCompanyChange(){
  const val = document.getElementById('mf_company').value;
  document.getElementById('mf_companyOtherWrap').style.display = (val==='Other') ? '' : 'none';
}

function showMeetingModal({title,hint,values,onSave}){
  const html = `
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>${escapeHtml(title)}</h2>
      <div class="hint">${escapeHtml(hint)}</div>
      <div class="field"><label>Meeting With *</label><input type="text" id="mf_with" value="${escapeAttr(values.MeetingWith||'')}" placeholder="Person / purpose"></div>
      ${meetingFieldsHtml(values)}
      ${meetingCompanyFieldHtml(values)}
      <div class="field"><label>Meeting Status</label><select id="mf_status">
        ${MEETING_STATUS_LIST.map(s=>`<option value="${s.key}" ${(values.Status||'Pending')===s.key?'selected':''}>${s.label}</option>`).join('')}
      </select></div>
      <div class="field"><label>Start Date &amp; Time *</label><input type="datetime-local" id="mf_start" value="${values.StartDateTime||''}"></div>
      <div class="field"><label>End Date &amp; Time</label><input type="datetime-local" id="mf_end" value="${values.EndDateTime||''}"></div>
      <div class="field"><label>Remarks</label><textarea id="mf_remarks" placeholder="Notes about this meeting...">${escapeHtml(values.Remarks||'')}</textarea></div>
      <div class="modalActions">
        <button class="btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" id="saveMeetingBtn">Save</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('saveMeetingBtn').addEventListener('click', async ()=>{
    const withWhom = document.getElementById('mf_with').value.trim();
    if(!withWhom){ alert('Please enter who the meeting is with'); return; }
    const start = document.getElementById('mf_start').value;
    if(!start){ alert('Please choose a start date & time'); return; }
    const type = document.getElementById('mf_type').value;
    const companySel = document.getElementById('mf_company').value;
    const companyOther = document.getElementById('mf_companyOther');
    const vals = {
      MeetingWith: withWhom,
      Type: type,
      Platform: type==='Online' ? (document.getElementById('mf_platform')?document.getElementById('mf_platform').value:'') : '',
      MeetingLink: type==='Online' ? (document.getElementById('mf_link')?document.getElementById('mf_link').value.trim():'') : '',
      Location: type==='Offline' ? (document.getElementById('mf_location')?document.getElementById('mf_location').value.trim():'') : '',
      Company: companySel==='Other' ? (companyOther?companyOther.value.trim():'') : companySel,
      Status: document.getElementById('mf_status').value,
      StartDateTime: start,
      EndDateTime: document.getElementById('mf_end').value,
      Remarks: document.getElementById('mf_remarks').value.trim()
    };
    const btn = document.getElementById('saveMeetingBtn');
    btn.disabled = true; btn.textContent='Saving...';
    try{ await onSave(vals); }
    catch(err){ alert('Error: '+err.message); btn.disabled=false; btn.textContent='Save'; }
  });
}

function openAddMeeting(){
  showMeetingModal({
    title:'Add New Meeting', hint:'Fill in the meeting details', values:{Type:'Online', Status:'Pending'},
    onSave: async (vals)=>{
      const res = await apiAdd('meetings', vals);
      meetings.push({...vals, ID:res.id});
      saveCache('meetings', meetings);
      showToast('Meeting saved ✅');
      closeModal();
      renderMeetingsView();
    }
  });
}
function openUpdateMeeting(id){
  const m = meetings.find(x=>x.ID===id);
  if(!m) return;
  showMeetingModal({
    title: m.MeetingWith+' - Update', hint:'Update this meeting', values: m,
    onSave: async (vals)=>{
      vals.ID = id;
      await apiUpdate('meetings', vals);
      const idx = meetings.findIndex(x=>x.ID===id);
      if(idx!==-1) meetings[idx] = {...meetings[idx], ...vals};
      saveCache('meetings', meetings);
      showToast('Meeting updated ✅');
      closeModal();
      renderMeetingsView();
    }
  });
}
async function removeMeeting(id,name){
  if(!confirm('Delete meeting with '+name+'? This cannot be undone.')) return;
  try{
    await apiDelete('meetings', id);
    meetings = meetings.filter(m=>m.ID!==id);
    saveCache('meetings', meetings);
    showToast('Deleted');
    renderMeetingsView();
  }catch(err){ showToast('Error: '+err.message); }
}
async function quickMeetingStatus(id, status){
  const m = meetings.find(x=>x.ID===id);
  if(!m) return;
  try{
    await apiUpdate('meetings', {...m, ID:id, Status:status});
    const idx = meetings.findIndex(x=>x.ID===id);
    if(idx!==-1) meetings[idx] = {...meetings[idx], Status:status};
    saveCache('meetings', meetings);
    showToast('Marked '+status+' ✅');
    renderMeetingsView();
  }catch(err){ showToast('Error: '+err.message); }
}

/* ================== TO-DO LIST ================== */
let todos = [];
let todoFilter = 'PENDING';

async function refreshTodos(){
  await loadEntityOfflineFirst('todos', (data)=>{ todos = data; }, renderTodosView);
}

function renderTodosStats(){
  const today = todayStr();
  const total = todos.length;
  const pending = todos.filter(t=>t.Status!=='Completed').length;
  const completed = todos.filter(t=>t.Status==='Completed').length;
  const overdue = todos.filter(t=> t.Status!=='Completed' && dtDate(t.DateTime) && dtDate(t.DateTime)<today).length;
  let html = '<div class="stats">';
  html += statCardT('ALL','Total Tasks', total, '📋', '#2b5c8f');
  html += statCardT('PENDING','Pending', pending, '⏳', '#b8862d');
  html += statCardT('OVERDUE','Overdue', overdue, '⚠️', '#b3402f');
  html += statCardT('DONE','Completed', completed, '✅', '#1f7a4d');
  html += '</div>';
  return html;
}
function statCardT(key,label,num,icon,color){
  const active = todoFilter===key ? ' active' : '';
  return '<div class="stat'+active+'" style="--sc:'+color+'" onclick="setTodoFilter(\''+key+'\')"><span class="icon">'+icon+'</span><div class="num">'+num+'</div><div class="lbl">'+label+'</div></div>';
}
function setTodoFilter(key){ todoFilter = key; renderTodosView(); }

function getFilteredTodos(){
  const today = todayStr();
  return todos.filter(t=>{
    if(todoFilter==='PENDING') return t.Status!=='Completed';
    if(todoFilter==='DONE') return t.Status==='Completed';
    if(todoFilter==='OVERDUE') return t.Status!=='Completed' && dtDate(t.DateTime) && dtDate(t.DateTime)<today;
    return true;
  }).sort((a,b)=> String(a.DateTime||'9999').localeCompare(String(b.DateTime||'9999')));
}

function renderTodosTable(){
  const list = getFilteredTodos();
  if(list.length===0){
    return '<div class="card"><div class="empty"><h3>No tasks found</h3><p>Click "+ New Task" above to add one.</p></div></div>';
  }
  let rows = list.map(t=>{
    const done = t.Status==='Completed';
    const remindLink = t.DateTime ? `<a href="${escapeAttr(gcalLink(t.NameOfWork, t.DateTime, '', (t.Purpose?t.Purpose+' — ':'')+(t.Remarks||''), ''))}" target="_blank" rel="noopener" class="btn-outline" style="display:inline-block;text-decoration:none;padding:6px 10px;font-size:.78rem;">🔔 Remind Me</a>` : '';
    return `<tr>
      <td data-label="Work">${escapeHtml(t.NameOfWork)}</td>
      <td data-label="Purpose">${escapeHtml(t.Purpose||'')}</td>
      <td data-label="Date & Time">${escapeHtml(dtPretty(t.DateTime))}</td>
      <td data-label="Status"><span class="badge ${done?'b-converted':'b-postponed'}">${done?'Completed ✅':'Pending'}</span></td>
      <td data-label="Reminder">${remindLink}</td>
      <td data-label="Remarks">${escapeHtml(t.Remarks||'')}</td>
      <td data-label="Actions"><div class="rowActions">
        <button class="btn-secondary" onclick="toggleTodoStatus('${t.ID}')">${done?'Mark Pending':'Mark Done'}</button>
        <button class="btn-outline" onclick="openUpdateTodo('${t.ID}')">Update</button>
        <button class="btn-danger" onclick="removeTodo('${t.ID}','${escapeAttr(t.NameOfWork)}')">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
  return `<div class="card"><table>
    <thead><tr><th>Work</th><th>Purpose</th><th>Date &amp; Time</th><th>Status</th><th>Reminder</th><th>Remarks</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

    if(items.length===0){ html += '<div class="upcomingEmpty">Nothing scheduled</div>'; }

        html += `<div class="upcomingItem" onclick="openUpdateTodo('${t.ID}')">

function showTodoModal({title,hint,values,onSave}){
  const html = `
  <div class="overlay" id="overlay">
    <div class="modal">

function openAddTodo(){
  showTodoModal({
    title:'Add New Task', hint:'Fill in the task details', values:{Status:'Pending'},

      const res = await apiAdd('todos', vals);

      showToast('Task saved ✅');
      closeModal();
      renderTodosView();
    }
  });
}
function openUpdateTodo(id){
  const t = todos.find(x=>x.ID===id);
  if(!t) return;
  showTodoModal({
    title: t.NameOfWork+' - Update', hint:'Update this task', values: t,
    onSave: async (vals)=>{
      vals.ID = id;
      await apiUpdate('todos', vals);
      const idx = todos.findIndex(x=>x.ID===id);
      if(idx!==-1) todos[idx] = {...todos[idx], ...vals};
      saveCache('todos', todos);
      showToast('Task updated ✅');
      closeModal();
      renderTodosView();
    }
  });
}
async function toggleTodoStatus(id){
  const t = todos.find(x=>x.ID===id);
  if(!t) return;
  const newStatus = t.Status==='Completed' ? 'Pending' : 'Completed';
  try{
    await apiUpdate('todos', {...t, ID:id, Status: newStatus});
    const idx = todos.findIndex(x=>x.ID===id);
    if(idx!==-1) todos[idx] = {...todos[idx], Status:newStatus};
    saveCache('todos', todos);
    showToast('Updated ✅');
    renderTodosView();
  }catch(err){ showToast('Error: '+err.message); }
}
async function removeTodo(id,name){
  if(!confirm('Delete task "'+name+'"? This cannot be undone.')) return;
  try{
    await apiDelete('todos', id);
    todos = todos.filter(t=>t.ID!==id);
    saveCache('todos', todos);
    showToast('Deleted');
    renderTodosView();
  }catch(err){ showToast('Error: '+err.message); }
}

let homeSyncInProgress = false;
async function refreshHome(){
  const cc = loadCache('customers'), cm = loadCache('meetings'), ct = loadCache('todos');
  const haveAnyCache = cc || cm || ct;
  if(haveAnyCache){
    customers = cc || []; meetings = cm || []; todos = ct || [];
    renderHomeView();
    setSyncStatus('syncing', 'customers');
  } else {
    app.innerHTML = '<div class="loading">Loading...</div>';
  }

  if(homeSyncInProgress) return;

  if(!navigator.onLine){
    if(haveAnyCache){
      setSyncStatus('offline', 'customers');
      showToast('No internet connection. Showing last synced data.', 2200);
    } else {
      setSyncStatus('nodata', 'customers');
      app.innerHTML = '<div class="empty"><h3>No internet connection</h3><p>Initial data cannot be loaded yet. Please connect to the internet and try again.</p><button class="btn-primary" onclick="loadCurrentView()">Retry</button></div>';
    }
    return;
  }

  homeSyncInProgress = true;
  const results = await Promise.allSettled([apiList('customers'), apiList('meetings'), apiList('todos')]);
  homeSyncInProgress = false;
  const [rc, rm, rt] = results;
  let anySuccess = false;
  if(rc.status==='fulfilled'){ customers = rc.value; saveCache('customers', rc.value); anySuccess = true; }
  if(rm.status==='fulfilled'){ meetings = rm.value; saveCache('meetings', rm.value); anySuccess = true; }
  if(rt.status==='fulfilled'){ todos = rt.value; saveCache('todos', rt.value); anySuccess = true; }
  const allFailed = results.every(r=>r.status==='rejected');
  if(allFailed && !haveAnyCache){
    setSyncStatus('nodata','customers');
    app.innerHTML = '<div class="empty"><h3>No internet connection</h3><p>Could not load data and nothing is cached yet on this device. Please connect to the internet and try again.</p><button class="btn-primary" onclick="loadCurrentView()">Retry</button></div>';
    return;
  }
  renderHomeView();
  if(allFailed){
    setSyncStatus('offline','customers');
    showToast('Unable to sync. Showing last synced data.', 2200);
  } else {
    setSyncStatus('synced','customers');
    if(haveAnyCache && anySuccess) showToast('Latest data synced ✅', 1500);
  }
}

const REPORT_CATEGORIES = ['Insurance','Real Estate','Mutual Funds'];
let reportDateField = 'CreatedDate';
let reportFromDate = '';
let reportToDate = '';

function getReportFilteredCustomers(){
  if(!reportFromDate && !reportToDate) return customers;
  return customers.filter(c=>{
    const v = normDate(c[reportDateField]);
    if(!v) return false;
    if(reportFromDate && v < reportFromDate) return false;
    if(reportToDate && v > reportToDate) return false;
    return true;
  });
}

function reportMatrixHtml(title, rows, rowKeyFn, dataset){
  let html = `<div class="card" style="margin-bottom:18px;"><div style="padding:14px 16px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line);">${escapeHtml(title)}</div>
  <table class="matrixTable"><thead><tr><th>${rows.label}</th>`;
  STATUS_LIST.forEach(s=> html += `<th>${s.label}</th>`);
  html += `<th>Total</th></tr></thead><tbody>`;
  rows.keys.forEach(key=>{
    const subset = dataset.filter(c=> rowKeyFn(c)===key);
    html += `<tr><td class="name-cell">${escapeHtml(key)}</td>`;
    STATUS_LIST.forEach(s=>{
      const n = subset.filter(c=>c.Status===s.key).length;
      html += `<td>${n||'-'}</td>`;
    });
    html += `<td style="font-weight:700;">${subset.length}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function reportDateFilterBar(){
  return `<div class="card" style="margin-bottom:18px;padding:14px 16px;">
    <div style="font-weight:700;color:var(--navy);margin-bottom:10px;">📆 Filter by Date Range</div>
    <div class="toolbar" style="margin-bottom:0;">
      <select id="rf_field">
        <option value="CreatedDate" ${reportDateField==='CreatedDate'?'selected':''}>Date Added</option>
        <option value="AppointmentDate" ${reportDateField==='AppointmentDate'?'selected':''}>Appointment Date</option>
        <option value="NextFollowupDate" ${reportDateField==='NextFollowupDate'?'selected':''}>Next Follow-up Date</option>
      </select>
      <input type="date" id="rf_from" value="${reportFromDate}">
      <span style="color:var(--muted);">to</span>
      <input type="date" id="rf_to" value="${reportToDate}">
      <button class="btn-primary" onclick="applyReportFilter()">Apply</button>
      <button class="btn-outline" onclick="clearReportFilter()">Clear</button>
    </div>
  </div>`;
}
function applyReportFilter(){
  reportDateField = document.getElementById('rf_field').value;
  reportFromDate = document.getElementById('rf_from').value;
  reportToDate = document.getElementById('rf_to').value;
  renderReportsView();
}
function clearReportFilter(){
  reportFromDate = ''; reportToDate = '';
  renderReportsView();
}

function renderReportsView(){
  const dataset = getReportFilteredCustomers();
  let html = reportDateFilterBar();
  html += `<div class="toolbar">
    <button class="btn-secondary" onclick="downloadFullReportCSV()">⬇️ Download Full Report (CSV)</button>
    <button class="btn-secondary" onclick="shareReportWhatsApp()">📤 Share Summary (WhatsApp)</button>
    <button class="btn-outline" onclick="window.print()">🖨️ Print / Save as PDF</button>
    <button class="btn-outline" onclick="downloadFullBackupExcel()">⬇️ Full Backup (Excel)</button>`;
  if(reportFromDate || reportToDate){
    html += `<span style="color:var(--muted);font-size:.85rem;">Showing ${dataset.length} of ${customers.length} customers</span>`;
  }
  html += `</div>`;

  // Category x Status
  html += reportMatrixHtml('By Service Category', {label:'Category', keys:REPORT_CATEGORIES}, c=>c.Category||'Other', dataset);

  // Insurance sub-type x Status
  const insuranceTypes = [...new Set(dataset.filter(c=>c.Category==='Insurance' && c.SubCategory).map(c=>c.SubCategory))];
  if(insuranceTypes.length>0){
    html += reportMatrixHtml('Insurance - By Type', {label:'Insurance Type', keys:insuranceTypes}, c=>c.SubCategory, dataset);
  }

  // Real Estate sub-type x Status
  const reTypes = [...new Set(dataset.filter(c=>c.Category==='Real Estate' && c.SubCategory).map(c=>c.SubCategory))];
  if(reTypes.length>0){
    html += reportMatrixHtml('Real Estate - By Property Type', {label:'Property Type', keys:reTypes}, c=>c.SubCategory, dataset);
  }

  app.innerHTML = html;
}

function downloadFullReportCSV(){
  const dataset = getReportFilteredCustomers();
  const header = ['Name','Phone','Category','SubCategory','Company','Status','AppointmentDate','NextFollowupDate','Notes'];
  const esc = (v)=> '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines = [header.join(',')];
  dataset.forEach(c=>{
    lines.push(header.map(h=>esc(c[h])).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'customer_report_'+todayStr()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function shareReportWhatsApp(){
  const dataset = getReportFilteredCustomers();
  let msg = '*KNR Fortune Financial Services*\nCustomer Report';
  if(reportFromDate || reportToDate) msg += ' ('+(reportFromDate||'start')+' to '+(reportToDate||'today')+')';
  msg += '\n\n';
  REPORT_CATEGORIES.forEach(cat=>{
    const subset = dataset.filter(c=>(c.Category||'Other')===cat);
    if(subset.length===0) return;
    msg += '*'+cat+'* - Total: '+subset.length+'\n';
    STATUS_LIST.forEach(s=>{
      const n = subset.filter(c=>c.Status===s.key).length;
      if(n>0) msg += '  '+s.label+': '+n+'\n';
    });
    msg += '\n';
  });
  msg += 'Total Customers: '+dataset.length;
  window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}

async function downloadFullBackupExcel(){
  if(typeof XLSX === 'undefined'){ alert('Excel library did not load. Please check your internet connection and try again.'); return; }
  showToast('Preparing backup...');
  try{
    const [cust, meet, task, hist] = await Promise.all([
      apiList('customers'), apiList('meetings'), apiList('todos'), apiList('history')
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cust), 'Customers');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(meet), 'Meetings');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(task), 'Todos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hist), 'History');
    XLSX.writeFile(wb, 'KNR_Fortune_CRM_Backup_'+todayStr()+'.xlsx');
    showToast('Backup downloaded ✅');
  }catch(err){
    alert('Backup failed: '+err.message);
  }
}

function renderLockScreen(mode, opts){
  opts = opts || {};
  pinMode = mode;
  pinBuffer = '';
  let title, sub, showForgot = false, showPad = true;

  if(mode === 'setup1'){
    title = 'Create a PIN'; sub = 'Choose a 4-digit PIN to protect this app';
  } else if(mode === 'setup2'){
    title = 'Confirm PIN'; sub = 'Enter the same PIN again';
  } else if(mode === 'unlock'){
    title = 'Enter PIN'; sub = 'Enter your 4-digit PIN to continue'; showForgot = true;
  } else if(mode === 'recoverAnswer'){
    title = 'Forgot PIN'; sub = opts.question || 'Answer your security question'; showPad = false;
  } else if(mode === 'recoverSet1'){
    title = 'Set New PIN'; sub = 'Choose a new 4-digit PIN';
  } else if(mode === 'recoverSet2'){
    title = 'Confirm New PIN'; sub = 'Enter the new PIN again';
  } else if(mode === 'securitySetup'){
    title = 'Security Question'; sub = 'Set a recovery question in case you forget your PIN'; showPad = false;
  }

  let inner = `
    <div class="icon">🔒</div>
    <h2>${title}</h2>
    <p>${sub}</p>
  `;

  if(showPad){
    inner += `<div class="pinDots" id="pinDots">${'<div class="pinDot"></div>'.repeat(4)}</div>`;
    inner += `<div class="lockError" id="lockError"></div>`;
    inner += `<div class="pinPad">`;
    for(let i=1;i<=9;i++) inner += `<button onclick="pinPress('${i}')">${i}</button>`;
    inner += `<button class="pinClear" onclick="pinClearAll()">Clear</button>`;
    inner += `<button onclick="pinPress('0')">0</button>`;
    inner += `<button class="pinBack" onclick="pinBackspace()">⌫</button>`;
    inner += `</div>`;
    if(showForgot) inner += `<div style="margin-top:16px;"><button class="btn-link" onclick="startForgotFlow()">Forgot PIN?</button></div>`;
  } else if(mode === 'recoverAnswer'){
    inner += `<div class="field" style="text-align:left;"><input type="text" id="recoverAnswerInput" placeholder="Your answer"></div>
      <div class="lockError" id="lockError"></div>
      <button class="btn-primary" style="width:100%" onclick="submitRecoverAnswer()">Verify</button>`;
  } else if(mode === 'securitySetup'){
    inner += `<div class="field" style="text-align:left;"><label>Security Question</label>
      <input type="text" id="secQuestionInput" placeholder="e.g. Your first business partner's name?"></div>
      <div class="field" style="text-align:left;"><label>Answer</label>
      <input type="text" id="secAnswerInput" placeholder="Your answer"></div>
      <div class="lockError" id="lockError"></div>
      <button class="btn-primary" style="width:100%" onclick="submitSecuritySetup()">Save &amp; Finish</button>`;
  }

  const html = `<div class="lockWrap" id="lockWrap"><div class="lockBox">${inner}</div></div>`;
  const existing = document.getElementById('lockWrap');
  if(existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', html);
}

function updatePinDots(){
  const dots = document.querySelectorAll('#pinDots .pinDot');
  dots.forEach((d,i)=> d.classList.toggle('filled', i < pinBuffer.length));
}
function pinClearAll(){ pinBuffer=''; updatePinDots(); setLockError(''); }
function pinBackspace(){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); }
function setLockError(msg){ const el = document.getElementById('lockError'); if(el) el.textContent = msg; }

async function pinPress(digit){
  if(pinBuffer.length>=4) return;
  pinBuffer += digit;
  updatePinDots();
  if(pinBuffer.length===4){
    await handlePinComplete();
  }
}

async function handlePinComplete(){
  const hash = await sha256(pinBuffer);
  if(pinMode === 'setup1'){
    tempPin = pinBuffer;
    renderLockScreen('setup2');
  } else if(pinMode === 'setup2'){
    if(pinBuffer === tempPin){
      const pinHash = await sha256(tempPin);
      const existingSec = getSecurity();
      if(existingSec && existingSec.securityQuestion){
        // Changing PIN only - keep existing security question/answer
        existingSec.pinHash = pinHash;
        saveSecurity(existingSec);
        showToast('PIN updated ✅');
        document.getElementById('lockWrap').remove();
        resetInactivityTimer();
      } else {
        renderSecuritySetupWithPin(pinHash);
      }
    } else {
      setLockError('PINs did not match. Try again.');
      setTimeout(()=> renderLockScreen('setup1'), 900);
    }
  } else if(pinMode === 'unlock'){
    const sec = getSecurity();
    if(sec && hash === sec.pinHash){
      document.getElementById('lockWrap').remove();
      resetInactivityTimer();
    } else {
      setLockError('Incorrect PIN');
      pinBuffer=''; updatePinDots();
    }
  } else if(pinMode === 'recoverSet1'){
    tempPin = pinBuffer;
    renderLockScreen('recoverSet2');
  } else if(pinMode === 'recoverSet2'){
    if(pinBuffer === tempPin){
      const sec = getSecurity();
      sec.pinHash = await sha256(tempPin);
      saveSecurity(sec);
      showToast('PIN updated ✅');
      document.getElementById('lockWrap').remove();
      resetInactivityTimer();
    } else {
      setLockError('PINs did not match. Try again.');
      setTimeout(()=> renderLockScreen('recoverSet1'), 900);
    }
  }
}

let pendingPinHash = '';
function renderSecuritySetupWithPin(pinHash){
  pendingPinHash = pinHash;
  renderLockScreen('securitySetup');
}
async function submitSecuritySetup(){
  const q = document.getElementById('secQuestionInput').value.trim();
  const a = document.getElementById('secAnswerInput').value.trim();
  if(!q || !a){ setLockError('Please fill both fields'); return; }
  const answerHash = await sha256(a.toLowerCase());
  saveSecurity({ pinHash: pendingPinHash, securityQuestion: q, securityAnswerHash: answerHash });
  showToast('PIN set up ✅');
  document.getElementById('lockWrap').remove();
  resetInactivityTimer();
}

function startForgotFlow(){
  const sec = getSecurity();
  if(!sec){ return; }
  renderLockScreen('recoverAnswer', {question: sec.securityQuestion});
}
async function submitRecoverAnswer(){
  const val = document.getElementById('recoverAnswerInput').value.trim().toLowerCase();
  const sec = getSecurity();
  const hash = await sha256(val);
  if(hash === sec.securityAnswerHash){
    renderLockScreen('recoverSet1');
  } else {
    setLockError('That answer is not correct. Try again.');
  }
}

// Used from Settings > Change PIN (only reachable when already unlocked)
function startPinSetupFlow(isChange){
  renderLockScreen('setup1');
}

/* ================== NETWORK RECONNECTION ================== */
window.addEventListener('online', ()=>{
  showToast('Internet restored. Syncing latest data...', 1800);
  loadCurrentView();
});
window.addEventListener('offline', ()=>{
  const entity = currentView==='home' ? 'customers' : currentView;
  setSyncStatus('offline', entity);
  showToast('No internet connection. Showing last synced data.', 2200);
});

/* ================== PULL-TO-REFRESH ================== */
// Custom pull-down-to-sync gesture that only fires when the page is scrolled
// to the very top. This replaces the browser's native pull-to-refresh (which
// can feel like the screen jumping / behaving oddly) with a safe in-app sync
// that never logs out, never navigates away, and never clears existing data.
(function setupPullToRefresh(){
  let startY = 0, pulling = false, triggered = false;
  const THRESHOLD = 130; // deliberate heavy pull required, not a light swipe
  let indicator = null;

  function ensureIndicator(){
    if(indicator) return indicator;
    indicator = document.createElement('div');
    indicator.id = 'ptrIndicator';
    indicator.style.cssText = 'position:fixed;top:0;left:0;right:0;text-align:center;padding:10px;font-size:.82rem;color:#fff;background:var(--navy);transform:translateY(-100%);transition:transform .15s;z-index:300;pointer-events:none;';
    indicator.textContent = '↓ Pull down to refresh';
    document.body.appendChild(indicator);
    return indicator;
  }
  function resetIndicator(){
    if(indicator) indicator.style.transform = 'translateY(-100%)';
  }
  function cancelPull(){
    pulling = false;
    triggered = false;
    resetIndicator();
  }

  // Only ever begins tracking when the page is genuinely at the very top —
  // if the user is scrolling through a list, this never activates.
  document.addEventListener('touchstart', (e)=>{
    if(document.getElementById('lockWrap') || document.getElementById('overlay')) return; // never interfere with lock screen or modals
    if((window.scrollY||document.documentElement.scrollTop||0) > 0) { pulling = false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
    triggered = false;
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!pulling) return;
    const scrollTop = window.scrollY||document.documentElement.scrollTop||0;
    if(scrollTop > 0){
      // user's gesture turned into a normal scroll away from the top — cancel pull entirely
      cancelPull();
      return;
    }
    const dy = e.touches[0].clientY - startY;
    if(dy > 15){
      const el = ensureIndicator();
      const pull = Math.min(dy, 180);
      el.style.transform = 'translateY('+(Math.min(pull,THRESHOLD+40)-40)+'px)';
      el.textContent = pull > THRESHOLD ? '↑ Release to refresh' : '↓ Pull down to refresh';
      triggered = pull > THRESHOLD;
    } else {
      resetIndicator();
      triggered = false;
    }
    // Intentionally never call preventDefault() here — normal scrolling must
    // always keep working; we only ever read the gesture, never block it.
  }, {passive:true});

  document.addEventListener('touchend', ()=>{
    if(!pulling) return;
    pulling = false;
    resetIndicator();
    if(triggered){
      triggered = false;
      if(!navigator.onLine){
        showToast('No internet connection. Showing last synced data.', 2200);
      } else {
        showToast('Refreshing...', 1000);
      }
      loadCurrentView();
    }
  }, {passive:true});

  document.addEventListener('touchcancel', cancelPull, {passive:true});
})();

/* ================== BOOT ================== */
(function boot(){
  const sec = getSecurity();
  if(!sec){
    renderLockScreen('setup1');
  } else {
    renderLockScreen('unlock');
  }
  initApp();
})();
</script>
